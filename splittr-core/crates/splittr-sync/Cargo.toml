[package]
name = "splittr-sync"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Transport-agnostic op-set reconciliation + the Transport seam for Splittr sync (#9/#20)."

[dependencies]
splittr-crdt = { path = "../splittr-crdt" }
splittr-store = { path = "../splittr-store" }
serde = { workspace = true }
postcard = { workspace = true }
# Async byte-stream IO for the framed transport (a `Transport` over any
# AsyncRead+AsyncWrite pair — e.g. an iroh QUIC bi-stream, #20).
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
