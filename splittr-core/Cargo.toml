[workspace]
resolver = "2"
members = [
    "crates/splittr-domain",
    "crates/splittr-crypto",
    "crates/splittr-crdt",
    "crates/splittr-store",
    "crates/splittr-sync",
    "crates/splittr-app",
    "crates/splittr-ffi",
]

# Declared minimum supported Rust version, inherited by every crate and verified
# by the `msrv` CI job. Floor is set by the crypto stack's `zeroize_derive`
# (edition 2024, rustc 1.85).
[workspace.package]
rust-version = "1.85"

# Shared dependency versions for the engine workspace. The remaining crate
# (splittr-sync) joins with the transport work — see docs/ARCHITECTURE.md §3.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# Canonical, compact binary encoding used to hash ops into content-addressed
# ids (ADR-0001). Deterministic across platforms.
postcard = { version = "1", features = ["use-std"] }
blake3 = "1"
# Identity / signatures.
ed25519-dalek = "2"
getrandom = "0.2"
serde-big-array = "0.5"
# Symmetric AEAD for at-rest encryption (#22) and X25519 key agreement (#6/#14).
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
# BIP39 recovery phrase for the identity seed (#34).
bip39 = "2"
# Password-based KDF (Argon2id) for sealing the root seed under a PIN (#34).
argon2 = "0.5"
# Best-effort wiping of secret material from memory (#41). No `derive` feature —
# the proc-macro raises the MSRV; the impls are hand-written instead.
zeroize = "1"
# Pure-Rust embedded store for the durable op-log (no C toolchain; stores
# opaque, eventually-encrypted op bytes keyed by content id).
redb = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
# Structured, zero-cost-when-disabled instrumentation at the use-case/trust
# boundaries (#5). The pure fold stays uninstrumented to preserve determinism.
tracing = "0.1"
proptest = "1"
tempfile = "3"
# Async runtime — for exercising the async `Transport` over an in-memory duplex
# in tests (the iroh transport is the production user).
tokio = { version = "1", features = ["rt", "macros", "sync"] }

[profile.release]
opt-level = 3

