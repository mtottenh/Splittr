name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  engine:
    name: Rust engine (splittr-core)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: splittr-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: splittr-core
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    name: Rust MSRV (1.85)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: splittr-core
    steps:
      - uses: actions/checkout@v4
      # Must match `rust-version` in the workspace manifest.
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: splittr-core
      - run: cargo check --workspace --all-targets

  audit:
    name: Security advisories (cargo-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: splittr-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: splittr-core
      - run: cargo install cargo-audit --locked
      # Fails on a security vulnerability in any (transitive) dependency.
      - run: cargo audit

  flutter:
    name: Flutter shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: splittr-core
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Codegen-drift guard (#2c): regenerate the FRB bindings and fail if they
      # differ from what's committed, so Dart and Rust can't silently diverge.
      - name: Assert FRB bindings are in sync
        run: |
          cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
          flutter_rust_bridge_codegen generate
          if ! git diff --exit-code -- lib/src/rust splittr-core/crates/splittr-ffi/src/frb_generated.rs; then
            echo "::error::FRB bindings are stale; run flutter_rust_bridge_codegen generate and commit"
            exit 1
          fi
      - run: flutter analyze
      # Clean-break guard (#1): the v1 Dart JSON store must stay deleted.
      - name: Assert v1 JSON store is gone
        run: |
          if grep -rnE "FilePersistence|AppRepository|splittr_data\.json" lib test; then
            echo "::error::v1 JSON store references found; the Rust store is the source of truth"
            exit 1
          fi
      # The bridge test host-loads the engine cdylib, so build it first.
      - run: cargo build -p splittr-ffi
        working-directory: splittr-core
      - run: flutter test

  linux-app:
    name: Linux desktop build (engine bundled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: splittr-core
      # GTK for the runner; libsecret for the flutter_secure_storage plugin.
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --debug
      # Fail if the engine did not get bundled next to the Flutter library.
      - run: test -f build/linux/x64/debug/bundle/lib/libsplittr_ffi.so
