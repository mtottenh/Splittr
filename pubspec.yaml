name: splittr
description: "Splittr — a cross-platform expense sharing app (Splitwise clone) for iOS, Android, Windows, Linux, macOS and the web."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Bindings to the Rust splittr-core engine (generated into lib/src/rust/).
  flutter_rust_bridge: 2.12.0
  freezed_annotation: ^2.4.4

  # State management — Riverpod gives compile-safe, testable, decoupled
  # providers without BuildContext gymnastics.
  flutter_riverpod: ^2.6.1

  # Cross-platform path to the per-app documents directory
  # (iOS / Android / Windows / Linux / macOS / web all supported).
  path_provider: ^2.1.5

  # OS keystore (Keychain / Keystore / libsecret / DPAPI) for the identity seed
  # and the at-rest DB encryption key (#6/#22).
  flutter_secure_storage: ^9.2.2

  # Stable, collision-resistant identifiers for entities.
  uuid: ^4.5.1

  # Locale-aware currency and date formatting.
  intl: ^0.20.2

  # iOS-style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended lint set, enabled via analysis_options.yaml.
  flutter_lints: ^6.0.0

  # Codegen for the flutter_rust_bridge-generated bindings.
  build_runner: ^2.4.13
  freezed: ^2.5.7

flutter:
  uses-material-design: true
